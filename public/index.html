<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greek TV Dial</title>
<meta name="description" content="Και τα 251 ελληνικά κανάλια σε ένα πλέγμα, με το τρέχον πρόγραμμα και ενσωματωμένη αναπαραγωγή.">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1018" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!-- Root-absolute, not relative: on a /c/<slug> deep link a relative href would
     resolve to /c/styles.css and silently 404. -->
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24">
    <path d="M12 2.6l2.9 5.88 6.49.95-4.7 4.58 1.11 6.46L12 17.42l-5.8 3.05 1.1-6.46-4.69-4.58 6.49-.95z"/>
  </symbol>
  <symbol id="i-star-o" viewBox="0 0 24 24">
    <path d="M12 2.6l2.9 5.88 6.49.95-4.7 4.58 1.11 6.46L12 17.42l-5.8 3.05 1.1-6.46-4.69-4.58 6.49-.95zm0 3.38L10.02 10l-4.43.65 3.2 3.13-.75 4.4L12 16.1l3.96 2.08-.75-4.4 3.2-3.13L14 10z"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15zM16 16l5 5"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5L7 19.5z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 4l-8 8 8 8"/>
  </symbol>
  <symbol id="i-next" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 4l8 8-8 8"/>
  </symbol>
  <symbol id="i-link" viewBox="0 0 24 24">
    <path d="M10.6 13.4a1 1 0 0 1 0-1.4l1.4-1.4a1 1 0 0 1 1.4 1.4l-1.4 1.4a1 1 0 0 1-1.4 0zM8.5 15.5a3 3 0 0 1 0-4.2l2.8-2.8a3 3 0 0 1 4.2 4.2l-1.1 1.1-1.4-1.4 1.1-1.1a1 1 0 0 0-1.4-1.4L9.9 12.7a1 1 0 0 0 1.4 1.4l-1.4 1.4a3 3 0 0 1-1.4 0z"/>
    <path d="M3.8 20.2a4.5 4.5 0 0 1 0-6.4l3.2-3.2 1.4 1.4-3.2 3.2a2.5 2.5 0 0 0 3.6 3.6l3.2-3.2 1.4 1.4-3.2 3.2a4.5 4.5 0 0 1-6.4 0zM10.2 3.8a4.5 4.5 0 0 1 6.4 0 4.5 4.5 0 0 1 0 6.4l-3.2 3.2-1.4-1.4 3.2-3.2a2.5 2.5 0 0 0-3.6-3.6L8.4 8.4 7 7z"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M9.6 16.2L5.4 12l-1.4 1.4 5.6 5.6L20.4 7.6 19 6.2z"/>
  </symbol>
  <symbol id="i-ext" viewBox="0 0 24 24">
    <path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14zM5 5h5v2H6v11h11v-4h2v6H4V5z"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M5.3 3.9L3.9 5.3 10.6 12l-6.7 6.7 1.4 1.4L12 13.4l6.7 6.7 1.4-1.4L13.4 12l6.7-6.7-1.4-1.4L12 10.6z"/>
  </symbol>
</svg>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="bars" aria-hidden="true">
        <i style="background:hsl(218 58% 46%)"></i>
        <i style="background:hsl(142 58% 40%)"></i>
        <i style="background:hsl(48 70% 48%)"></i>
        <i style="background:hsl(28 75% 52%)"></i>
      </span>
      <b>Greek TV Dial</b>
      <small id="tagline">Φόρτωση…</small>
    </div>

    <div class="search" id="searchwrap">
      <svg class="mag" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Αναζήτηση καναλιού…" aria-label="Αναζήτηση καναλιού">
      <kbd>/</kbd>
    </div>

    <button class="btn zap" id="zap" type="button">
      <span aria-hidden="true">⤨</span> Ζάπινγκ
    </button>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Κατηγορίες">
    <h2>Κατηγορίες</h2>
    <ul id="cats"></ul>

    <div class="toggles">
      <label class="check" for="only-playable">
        <input type="checkbox" id="only-playable">
        <span>Μόνο με αναπαραγωγή</span>
      </label>
      <label class="check" for="only-guide">
        <input type="checkbox" id="only-guide">
        <span>Μόνο με πρόγραμμα</span>
      </label>
    </div>

    <div class="railfoot">
      <p id="rail-note"></p>
      <p>Πατήστε <b>/</b> για αναζήτηση.</p>
    </div>
  </nav>

  <main>
    <div class="guide-status" id="guide-status">
      <span class="led" aria-hidden="true"></span>
      <span id="guide-text">Φόρτωση προγράμματος…</span>
    </div>

    <div class="bar">
      <span class="count" id="count"></span>
      <div class="seg" role="group" aria-label="Ταξινόμηση">
        <button type="button" data-sort="cat" aria-pressed="true">Κατηγορία</button>
        <button type="button" data-sort="az" aria-pressed="false">Α–Ω</button>
        <button type="button" data-sort="num" aria-pressed="false">Αριθμός</button>
      </div>
    </div>

    <div id="out"></div>

    <div class="railfoot mobile" style="margin-top:24px">
      <p id="rail-note-mobile"></p>
    </div>
  </main>
</div>

<!-- player -->
<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="p-name">
  <div class="player-box">
    <div class="player-head">
      <span class="pl" id="p-plate" aria-hidden="true"></span>
      <span class="who">
        <b id="p-name"></b>
        <span id="p-meta"></span>
      </span>

      <div class="nav-pair">
        <button class="icon-btn" id="p-prev" type="button" aria-label="Προηγούμενο κανάλι" title="Προηγούμενο (←)">
          <svg aria-hidden="true"><use href="#i-prev"/></svg>
        </button>
        <button class="icon-btn" id="p-next-ch" type="button" aria-label="Επόμενο κανάλι" title="Επόμενο (→)">
          <svg aria-hidden="true"><use href="#i-next"/></svg>
        </button>
      </div>

      <button class="icon-btn" id="p-fav" type="button" aria-pressed="false" aria-label="Προσθήκη στα αγαπημένα">
        <svg aria-hidden="true"><use href="#i-star-o"/></svg>
      </button>
      <button class="icon-btn" id="p-copy" type="button"
              aria-label="Αντιγραφή συνδέσμου καναλιού" title="Αντιγραφή συνδέσμου">
        <svg aria-hidden="true"><use href="#i-link"/></svg>
      </button>
      <a class="icon-btn" id="p-out" href="#" target="_blank" rel="noopener"
         aria-label="Άνοιγμα στο greektv.live" title="Άνοιγμα στο greektv.live">
        <svg aria-hidden="true"><use href="#i-ext"/></svg>
      </a>
      <button class="icon-btn" id="p-close" type="button" aria-label="Κλείσιμο (Esc)" title="Κλείσιμο (Esc)">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>

    <div class="player-body">
      <div class="stage">
        <!-- No crossorigin attribute on purpose: Safari plays HLS natively through
             the media element without a CORS preflight, which many stream hosts
             would fail. hls.js does its own XHR and is unaffected. -->
        <video id="p-video" controls playsinline autoplay preload="none"></video>

        <!-- Channels with no open stream show their greektv.live page here
             instead of navigating away from the grid. -->
        <iframe id="p-frame" title="Σελίδα καναλιού στο greektv.live" hidden
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                referrerpolicy="no-referrer-when-downgrade"></iframe>

        <div class="note" id="p-note">
          <div>
            <div class="spin" id="p-spin" aria-hidden="true"></div>
            <b id="p-note-title"></b>
            <span id="p-note-body"></span>
          </div>
        </div>
      </div>

      <aside class="switcher" aria-label="Αλλαγή καναλιού">
        <div class="switcher-head">
          <span id="p-switch-count"></span>
        </div>
        <ul id="p-switch-list"></ul>
      </aside>
    </div>

    <div class="player-foot">
      <div class="row">
        <span class="k">Τώρα</span>
        <span class="v" id="p-now"></span>
      </div>
      <div class="row">
        <span class="k">Μετά</span>
        <span class="v" id="p-next"></span>
      </div>
      <p class="embed-note" id="p-embed-note" hidden>
        Αυτό το κανάλι δεν έχει ανοιχτή ροή, γι' αυτό φορτώνεται η σελίδα του στο
        greektv.live μέσα στη σελίδα. Πατήστε <b>Δείτε Τώρα</b> εκεί για να ξεκινήσει.
      </p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
